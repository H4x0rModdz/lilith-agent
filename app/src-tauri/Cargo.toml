[package]
name = "lilith-companion"
description = "Lilith - a local-first AI companion for Windows"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# O sufixo `_lib` evita conflito de nome entre lib e bin no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "lilith_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lilith-brain = { path = "../../crates/lilith-brain" }
lilith-guard = { path = "../../crates/lilith-guard" }
lilith-win = { path = "../../crates/lilith-win" }
lilith-agents = { path = "../../crates/lilith-agents" }
lilith-memory = { path = "../../crates/lilith-memory" }
async-trait.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
base64 = "0.22"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
chrono.workspace = true
reqwest.workspace = true
futures-util.workspace = true
sha2 = "0.10"
hound = "3.5"
libloading = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
